[package]
name = "greentic-triggers"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/greentic-biz/greentic-triggers"
description = "Time-based trigger schedules for the Greentic platform: typed recurrence + cron compilation + next-fire computation."
keywords = ["greentic", "cron", "schedule", "trigger"]
categories = ["date-and-time"]

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
cron = "0.16"
# Aligned with greentic-start (registry =1.3.0-research.1) so a single
# greentic-types EventEnvelope/TenantCtx type flows triggers -> start.
greentic-types = { version = "=1.3.0-research.1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
