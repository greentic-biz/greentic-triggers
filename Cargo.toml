[package]
name = "greentic-triggers"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/greenticai/greentic-triggers"
description = "Time-based trigger schedules for the Greentic platform: typed recurrence + cron compilation + next-fire computation."
keywords = ["greentic", "cron", "schedule", "trigger"]
categories = ["date-and-time"]

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
cron = "0.16"
# Pinned to greentic-types 1.3.0-research.2 (the higher 1.3.0-research point,
# shared by greentic-pack/config/qa/interfaces). .1->.2 is additive/non-breaking,
# so this lets consumers (e.g. greentic-operala) resolve triggers + pack on a
# single greentic-types without the .1-vs-.2 skew conflict.
greentic-types = { version = "=1.3.0-research.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
