[package]
name = "greentic-triggers"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/greenticai/greentic-triggers"
description = "Time-based trigger schedules for the Greentic platform: typed recurrence + cron compilation + next-fire computation."
keywords = ["greentic", "cron", "schedule", "trigger"]
categories = ["date-and-time"]

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
cron = "0.16"
# NOTE (SP3-slice1): path-deps the local greentic-types. greentic-start pins
# registry =1.3.0-research.1; alignment is enforced at integration (start's
# Task 6) via `cargo tree -p greentic-start -i greentic-types` — a single
# greentic-types must resolve across triggers+start or EventEnvelope types split.
greentic-types = { path = "../greentic-types", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
